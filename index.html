<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mold's Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a0a2e 50%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Subtle animated background */
        body::before {
            content: '';
            position: fixed;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle, rgba(100, 200, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: drift 20s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes drift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px 50px;
            backdrop-filter: blur(10px);
            background: rgba(15, 15, 30, 0.4);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 20px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 0 20px rgba(100, 200, 255, 0.05);
            max-width: 500px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.8em;
            font-weight: 700;
            background: linear-gradient(135deg, #64c8ff 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 50px;
            letter-spacing: -1px;
            line-height: 1.2;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-button {
            padding: 18px 32px;
            font-size: 1.05em;
            font-family: inherit;
            font-weight: 600;
            background: linear-gradient(135deg, rgba(100, 200, 255, 0.15) 0%, rgba(167, 139, 250, 0.15) 100%);
            color: #e0e0e0;
            border: 1.5px solid rgba(100, 200, 255, 0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .link-button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .link-button:hover {
            background: linear-gradient(135deg, rgba(100, 200, 255, 0.3) 0%, rgba(167, 139, 250, 0.3) 100%);
            border-color: rgba(100, 200, 255, 0.6);
            color: #fff;
            box-shadow: 
                0 0 20px rgba(100, 200, 255, 0.3),
                0 0 40px rgba(167, 139, 250, 0.2);
            transform: translateY(-2px);
        }

        .link-button:hover::before {
            transform: translateX(100%);
        }

        .link-button:active {
            transform: translateY(0px);
        }

        .icon {
            margin-right: 8px;
            font-size: 1.2em;
        }

        .subtitle {
            color: rgba(100, 200, 255, 0.6);
            font-size: 0.85em;
            margin-top: 45px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MOLD'S LINKS</h1>
        
        <div class="links-container">
            <button class="link-button" onclick="openInBlankTab('https://gtube.net/')">
                <span class="icon">▶</span>GTube
            </button>
            
            <button class="link-button" onclick="openInBlankTab('https://whoah.netlify.app/')">
                <span class="icon">◆</span>NautilusOS
            </button>
            
            <button class="link-button" onclick="openInBlankTab('https://classroom.progressiveschoolhouse.org/os')">
                <span class="icon">★</span>GalaxyV7
            </button>
        </div>

        <div class="subtitle">Access Portal</div>
    </div>

    <script>
        function openInBlankTab(url) {
            var w = window.open("about:blank", "_blank");
            w.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <style>
                        body { margin: 0; padding: 0; }
                        iframe { height: 100vh; width: 100vw; border: none; display: block; }
                    </style>
                </head>
                <body>
                    <iframe sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-top-navigation allow-top-navigation-by-user-activation" src="${url}"></iframe>
                </body>
                </html>
            `);
        }
    </script>
</body>
</html>

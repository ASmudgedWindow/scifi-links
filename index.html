<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mold's Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a0033 50%, #0f0824 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background stars */
        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 60px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 50px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 10px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 5s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px;
            background: rgba(10, 14, 39, 0.7);
            border: 3px solid #00ff88;
            border-radius: 10px;
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.5),
                0 0 40px rgba(138, 43, 226, 0.3),
                inset 0 0 20px rgba(0, 255, 136, 0.1);
            max-width: 600px;
        }

        h1 {
            font-size: 3.5em;
            color: #00ff88;
            text-shadow: 
                0 0 10px #00ff88,
                0 0 20px #00ff88,
                0 0 30px #8a2be2;
            margin-bottom: 60px;
            letter-spacing: 3px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88, 0 0 30px #8a2be2; }
            50% { text-shadow: 0 0 20px #00ff88, 0 0 30px #00ff88, 0 0 50px #8a2be2; }
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .link-button {
            padding: 20px 40px;
            font-size: 1.3em;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #8a2be2 0%, #4b0082 100%);
            color: #00ff88;
            border: 2px solid #00ff88;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }

        .link-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .link-button:hover {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #0a0e27;
            box-shadow: 
                0 0 15px rgba(0, 255, 136, 0.8),
                0 0 30px rgba(138, 43, 226, 0.6),
                inset 0 0 15px rgba(0, 255, 136, 0.2);
            transform: translateY(-3px);
        }

        .link-button:hover::before {
            left: 100%;
        }

        .link-button:active {
            transform: translateY(-1px);
        }

        .subtitle {
            color: #8a2be2;
            font-size: 0.9em;
            margin-top: 50px;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        /* Pulsing accent */
        .pulse {
            display: inline-block;
            animation: pulse-accent 1.5s ease-in-out infinite;
        }

        @keyframes pulse-accent {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>~ MOLD'S LINKS ~</h1>
        
        <div class="links-container">
            <button class="link-button" onclick="openInBlankTab('https://gtube.net/')">
                🎬 GTube
            </button>
            
            <button class="link-button" onclick="openInBlankTab('https://whoah.netlify.app/')">
                🖥️ NautilusOS
            </button>
            
            <button class="link-button" onclick="openInBlankTab('https://classroom.progressiveschoolhouse.org/os')">
                🌌 GalaxyV7
            </button>
        </div>

        <div class="subtitle">
            <span class="pulse">▲</span> INTERDIMENSIONAL PORTAL <span class="pulse">▼</span>
        </div>
    </div>

    <script>
        function openInBlankTab(url) {
            var w = window.open("about:blank", "_blank");
            w.document.write(`<iframe style="height:100%; width: 100%; border: none; position: fixed; top: 0; right: 0; left: 0; bottom: 0;" sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-top-navigation allow-top-navigation-by-user-activation" src="${url}"></iframe>`);
        }
    </script>
</body>
</html>
